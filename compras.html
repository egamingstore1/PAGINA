<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Compras</title>
    <!-- FontAwesome para íconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        .header-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #1e293b;
        }

        .header-title h2 {
            font-size: 1.4rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .total-badge {
            background-color: #1e293b;
            color: #94a3b8;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Tarjetas de Órdenes */
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .order-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 16px;
            border-left: 5px solid #64748b;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .order-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 12px -1px rgba(0, 0, 0, 0.4);
        }

        .order-card.procesando { border-left-color: #f59e0b; }
        .order-card.aprobado { border-left-color: #10b981; }
        .order-card.rechazado { border-left-color: #ef4444; }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .game-title-box {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-icon {
            width: 35px;
            height: 35px;
            background-color: #334155;
            color: #38bdf8;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .game-name {
            font-weight: 700;
            font-size: 1.05rem;
            color: #f8fafc;
        }

        /* Badges de Estado */
        .status-badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
        }

        .status-procesando { background-color: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .status-aprobado { background-color: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .status-rechazado { background-color: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

        /* Cuerpo de la tarjeta */
        .order-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            color: #64748b;
            font-size: 0.75rem;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .detail-value {
            color: #e2e8f0;
            font-weight: 600;
        }

        .price-highlight {
            color: #38bdf8;
            font-weight: 700;
        }

        .player-id-code {
            font-family: monospace;
            background-color: #1e293b;
            padding: 2px 6px;
            border-radius: 4px;
            color: #f1f5f9;
        }

        .click-hint {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            font-size: 0.75rem;
            color: #64748b;
        }

        /* Estado Vacío */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            background-color: #1e293b;
            border-radius: 12px;
            color: #64748b;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #334155;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background-color: #1e293b;
            width: 100%;
            max-width: 450px;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            color: #f8fafc;
        }

        .close-btn {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            font-size: 0.9rem;
        }

        .modal-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px dashed #334155;
        }

        .modal-row:last-child {
            border-bottom: none;
        }

        .modal-label {
            color: #94a3b8;
        }

        .modal-val {
            font-weight: 600;
            color: #f8fafc;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">
            <h2><i class="fa-solid fa-clock-rotate-left"></i> Mi Historial</h2>
            <span class="total-badge" id="totalOrdenes">0 Órdenes</span>
        </div>

        <div class="orders-list" id="listaCompras">
            <!-- Las tarjetas de compras se cargarán aquí -->
        </div>
    </div>

    <!-- Modal de Comprobante Completo -->
    <div class="modal-overlay" id="modalOrden" onclick="cerrarModalAfuera(event)">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalle del Comprobante</h3>
                <button class="close-btn" onclick="cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="modal-row">
                    <span class="modal-label">Juego:</span>
                    <span class="modal-val" id="modalJuego">-</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Estado:</span>
                    <span class="modal-val" id="modalEstado">-</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Paquete:</span>
                    <span class="modal-val" id="modalPaquete">-</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">ID de Jugador:</span>
                    <span class="modal-val" id="modalId">-</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Monto Pagado:</span>
                    <span class="modal-val price-highlight" id="modalMonto">-</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Banco Emisor:</span>
                    <span class="modal-val" id="modalBanco">-</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Referencia:</span>
                    <span class="modal-val" id="modalRef">-</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Fecha:</span>
                    <span class="modal-val" id="modalFecha">-</span>
                </div>
                <div class="modal-row">
                    <span class="modal-label">Hora:</span>
                    <span class="modal-val" id="modalHora">-</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ordenesGuardadas = [];

        // Limpia la referencia eliminando espacios, ceros a la izquierda y símbolos
        function normalizarRef(ref) {
            if (!ref) return '';
            return String(ref)
                .replace(/[^a-zA-Z0-9]/g, '') // Deja solo letras y números
                .replace(/^0+/, '')            // Quita ceros iniciales
                .trim()
                .toLowerCase();
        }

        // Función para separar Fecha y Hora de forma inteligente
        function obtenerFechaYHora(compra) {
            let stringFecha = compra.fecha || compra.created_at || compra.hora || '';

            if (!stringFecha) {
                const ahora = new Date();
                return {
                    fecha: ahora.toLocaleDateString(),
                    hora: ahora.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true })
                };
            }

            if (stringFecha.includes(',')) {
                let partes = stringFecha.split(',');
                return {
                    fecha: partes[0].trim(),
                    hora: partes[1] ? partes[1].trim() : 'N/A'
                };
            }

            if (stringFecha.includes(' ')) {
                let partes = stringFecha.trim().split(/\s+/);
                if (partes.length >= 2) {
                    let fecha = partes[0];
                    let hora = partes.slice(1).join(' ');
                    return { fecha: fecha, hora: hora };
                }
            }

            return {
                fecha: stringFecha,
                hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true })
            };
        }

        function cargarHistorialCliente() {
            let misCompras = JSON.parse(localStorage.getItem('mis_compras')) || [];
            let comprasClientes = JSON.parse(localStorage.getItem('compras_clientes')) || [];

            if (misCompras.length > 0 && comprasClientes.length > 0) {
                misCompras = misCompras.map(miCompra => {
                    const refCliente = normalizarRef(miCompra.ref || miCompra.referencia);
                    const idCliente = String(miCompra.id || miCompra.playerId || '').trim();
                    const montoCliente = String(miCompra.monto || miCompra.totalBs || '').trim();

                    // Buscar la orden correspondiente cargada por el Administrador
                    const coincidenciaAdmin = comprasClientes.find(c => {
                        const refAdmin = normalizarRef(c.ref || c.referencia);
                        const idAdmin = String(c.id || c.playerId || '').trim();
                        const montoAdmin = String(c.monto || c.totalBs || '').trim();

                        // 1. Intentar hacer coincidir por referencia limpia
                        if (refCliente !== '' && refAdmin !== '' && refCliente === refAdmin) {
                            return true;
                        }

                        // 2. Coincidencia alternativa por ID de jugador y Monto
                        if (idCliente !== '' && idCliente === idAdmin && montoCliente === montoAdmin) {
                            return true;
                        }

                        return false;
                    });

                    // Si existe en el panel de administración, sincronizar su estado
                    if (coincidenciaAdmin) {
                        const estadoAdmin = coincidenciaAdmin.estado || coincidenciaAdmin.status;
                        if (estadoAdmin) {
                            miCompra.estado = estadoAdmin;
                        }
                    }

                    return miCompra;
                });

                // Guardar la sincronización en mis_compras
                localStorage.setItem('mis_compras', JSON.stringify(misCompras));
            }

            ordenesGuardadas = misCompras;
            const contenedor = document.getElementById('listaCompras');
            const contador = document.getElementById('totalOrdenes');
            
            if (!contenedor || !contador) return;

            contenedor.innerHTML = '';
            contador.textContent = `${misCompras.length} ${misCompras.length === 1 ? 'Órden' : 'Órdenes'}`;

            if (misCompras.length === 0) {
                contenedor.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-box-open empty-icon"></i>
                        <h3>Sin recargas registradas</h3>
                        <p style="margin-top: 6px; font-size: 0.9rem;">Tus pedidos realizados aparecerán en esta sección.</p>
                    </div>
                `;
                return;
            }

            misCompras.forEach((compra, index) => {
                const card = document.createElement('div');

                let claseEstado = 'status-procesando';
                let tarjetaClase = 'procesando';
                let iconoEstado = 'fa-clock';
                let estadoTexto = (compra.estado || compra.status || 'PROCESANDO').toString().toUpperCase();

                if (estadoTexto === 'APROBADO' || estadoTexto === 'COMPLETADO' || estadoTexto === 'EXITOSO') {
                    claseEstado = 'status-aprobado';
                    tarjetaClase = 'aprobado';
                    iconoEstado = 'fa-circle-check';
                    estadoTexto = 'APROBADO';
                } else if (estadoTexto === 'RECHAZADO' || estadoTexto === 'NEGADO' || estadoTexto === 'CANCELADO') {
                    claseEstado = 'status-rechazado';
                    tarjetaClase = 'rechazado';
                    iconoEstado = 'fa-circle-xmark';
                    estadoTexto = 'NEGADO';
                } else {
                    estadoTexto = 'PROCESANDO';
                }

                const tiempo = obtenerFechaYHora(compra);

                card.className = `order-card ${tarjetaClase}`;
                card.onclick = () => abrirModalOrden(index);

                card.innerHTML = `
                    <div class="order-header">
                        <div class="game-title-box">
                            <div class="game-icon">
                                <i class="fa-solid fa-gamepad"></i>
                            </div>
                            <span class="game-name">${compra.juego || compra.game || 'Recarga de Juego'}</span>
                        </div>
                        <span class="status-badge ${claseEstado}">
                            <i class="fa-solid ${iconoEstado}"></i> ${estadoTexto}
                        </span>
                    </div>
                    <div class="order-body">
                        <div class="detail-item">
                            <span class="detail-label"><i class="fa-solid fa-box"></i> Paquete</span>
                            <span class="detail-value">${compra.paquete || compra.package || 'Estándar'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label"><i class="fa-solid fa-id-card"></i> ID Jugador</span>
                            <span class="detail-value">
                                <span class="player-id-code">${compra.id || compra.playerId || 'N/A'}</span>
                            </span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label"><i class="fa-solid fa-money-bill-wave"></i> Monto</span>
                            <span class="detail-value price-highlight">${compra.monto || compra.totalBs || '0 Bs'}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label"><i class="fa-solid fa-clock"></i> Hora</span>
                            <span class="detail-value">${tiempo.hora}</span>
                        </div>
                    </div>
                    <div class="click-hint">
                        <span><i class="fa-solid fa-circle-info"></i> Haz clic para ver el comprobante completo</span>
                        <i class="fa-solid fa-chevron-right"></i>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function abrirModalOrden(index) {
            const compra = ordenesGuardadas[index];
            if (!compra) return;

            let claseEstado = 'status-procesando';
            let iconoEstado = 'fa-clock';
            let estadoTexto = (compra.estado || compra.status || 'PROCESANDO').toString().toUpperCase();

            if (estadoTexto === 'APROBADO' || estadoTexto === 'COMPLETADO' || estadoTexto === 'EXITOSO') {
                claseEstado = 'status-aprobado';
                iconoEstado = 'fa-circle-check';
                estadoTexto = 'APROBADO';
            } else if (estadoTexto === 'RECHAZADO' || estadoTexto === 'NEGADO' || estadoTexto === 'CANCELADO') {
                claseEstado = 'status-rechazado';
                iconoEstado = 'fa-circle-xmark';
                estadoTexto = 'NEGADO';
            } else {
                estadoTexto = 'PROCESANDO';
            }

            const tiempo = obtenerFechaYHora(compra);

            document.getElementById('modalJuego').textContent = compra.juego || compra.game || 'Recarga de Juego';
            document.getElementById('modalEstado').innerHTML = `<span class="status-badge ${claseEstado}"><i class="fa-solid ${iconoEstado}"></i> ${estadoTexto}</span>`;
            document.getElementById('modalPaquete').textContent = compra.paquete || compra.package || 'Estándar';
            document.getElementById('modalId').textContent = compra.id || compra.playerId || 'N/A';
            document.getElementById('modalMonto').textContent = compra.monto || compra.totalBs || '0 Bs';
            document.getElementById('modalBanco').textContent = compra.banco || 'N/A';
            document.getElementById('modalRef').textContent = compra.ref || compra.referencia || 'N/A';
            document.getElementById('modalFecha').textContent = tiempo.fecha;
            document.getElementById('modalHora').textContent = tiempo.hora;

            document.getElementById('modalOrden').style.display = 'flex';
        }

        function cerrarModal() {
            document.getElementById('modalOrden').style.display = 'none';
        }

        function cerrarModalAfuera(e) {
            if (e.target.id === 'modalOrden') {
                cerrarModal();
            }
        }

        // Carga inicial al abrir
        document.addEventListener('DOMContentLoaded', cargarHistorialCliente);

        // Escucha cambios en LocalStorage (cuando editas en el Panel de Admin desde otra pestaña)
        window.addEventListener('storage', (e) => {
            cargarHistorialCliente();
        });

        // Verificación continua automática cada 1.5 segundos
        setInterval(cargarHistorialCliente, 1500);
    </script>
</body>
</html>
