<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso / Registro | E GAMING STORE</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #070a13; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .auth-card { background: #0f1626; border: 1px solid rgba(0, 210, 255, 0.2); border-radius: 12px; width: 100%; max-width: 400px; padding: 30px; box-shadow: 0 0 20px rgba(0,210,255,0.1); }
        .tabs { display: flex; margin-bottom: 25px; border-bottom: 1px solid #1e293b; }
        .tab-btn { flex: 1; padding: 10px; background: none; border: none; color: #aaa; font-size: 16px; font-weight: bold; cursor: pointer; }
        .tab-btn.active { color: #00d2ff; border-bottom: 2px solid #00d2ff; }
        
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #ccc; }
        .form-group input { width: 100%; padding: 12px; background: #070a13; border: 1px solid #1e293b; border-radius: 6px; color: #fff; font-size: 14px; outline: none; }
        .form-group input:focus { border-color: #00d2ff; }
        
        .submit-btn { width: 100%; padding: 12px; background: linear-gradient(90deg, #0052d4, #00d2ff); border: none; border-radius: 6px; color: #fff; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { opacity: 0.9; }
        
        .form-container { display: none; }
        .form-container.active { display: block; }
        .alert { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; }
        .alert-error { background: rgba(244, 67, 54, 0.2); color: #f44336; border: 1px solid #f44336; }
        .alert-success { background: rgba(76, 175, 80, 0.2); color: #4caf50; border: 1px solid #4caf50; }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Iniciar Sesión</button>
            <button class="tab-btn" onclick="switchTab('register')">Registrarse</button>
        </div>

        <!-- FORMULARIO DE INICIO DE SESIÓN -->
        <form id="login-form" class="form-container active" onsubmit="procesarAuth(event, 'login')">
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="login-email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="login-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">Ingresar</button>
        </form>

        <!-- FORMULARIO DE REGISTRO -->
        <form id="register-form" class="form-container" onsubmit="procesarAuth(event, 'registro')">
            <div class="form-group">
                <label>Nombre Completo</label>
                <input type="text" id="reg-nombre" required placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="reg-email" required placeholder="tu@email.com">
            </div>
            <div class="form-group">
                <label>WhatsApp / Teléfono</label>
                <input type="tel" id="reg-telefono" required placeholder="+58 412 1234567">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="reg-password" required placeholder="••••••••">
            </div>
            <button type="submit" class="submit-btn">Crear Cuenta</button>
        </form>

        <div id="msg-alert" class="alert"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:3000/api'; // Cambiar por tu IP/Dominio en producción

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form-container').forEach(form => form.classList.remove('active'));

            if(tab === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('login-form').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('register-form').classList.add('active');
            }
        }

        async function procesarAuth(e, tipo) {
            e.preventDefault();
            const alertBox = document.getElementById('msg-alert');
            alertBox.style.display = 'none';

            let endpoint = tipo === 'registro' ? '/registro' : '/login';
            let payload = tipo === 'registro' ? {
                nombre: document.getElementById('reg-nombre').value,
                email: document.getElementById('reg-email').value,
                telefono: document.getElementById('reg-telefono').value,
                password: document.getElementById('reg-password').value
            } : {
                email: document.getElementById('login-email').value,
                password: document.getElementById('login-password').value
            };

            try {
                const res = await fetch(`${API_URL}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (data.success) {
                    // Guardar sesión en el navegador
                    localStorage.setItem('usuario_gaming', JSON.stringify(data.usuario));
                    alertBox.className = 'alert alert-success';
                    alertBox.innerText = tipo === 'registro' ? '¡Registro exitoso! Redirigiendo...' : '¡Sesión iniciada!';
                    alertBox.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'index.html'; // Redirige a la página principal
                    }, 1500);
                } else {
                    alertBox.className = 'alert alert-error';
                    alertBox.innerText = data.message;
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = 'alert alert-error';
                alertBox.innerText = 'Error de conexión con el servidor.';
                alertBox.style.display = 'block';
            }
        }
    </script>
</body>
</html>
